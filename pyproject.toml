[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-hust-runtime-micro-optimizations"
version = "0.1.0"
description = "Default-off runtime micro-optimization MOD family for vLLM-HUST"
requires-python = ">=3.10"
dependencies = []

[project.entry-points."vllm.general_plugins"]
runtime_micro_optimizations = "vllm_hust_runtime_micro_optimizations:load"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
